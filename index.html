<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>2D Dice RPG</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="game-container">
  <canvas id="canvas"></canvas>

  <!-- Верхний HUD -->
  <div id="top-bar">
    <div class="hud-card">
      <div id="hero-name-label">Герой</div>
      <div id="hp-bar-wrap"><div id="hp-bar-fill"></div></div>
      <div id="mp-bar-wrap"><div id="mp-bar-fill"></div></div>
    </div>
    <div class="hud-card">Золото: <span id="gold-val">0</span> 🪙</div>
    <div class="hud-card" id="inv-hud">Оружие: <span>Ржавый нож</span></div>
  </div>

  <!-- Миникарта в правом верхнем углу -->
  <div id="minimap-container">
    <canvas id="minimap-canvas" width="84" height="84"></canvas>
  </div>

  <!-- Джойстик по центру -->
  <div id="joystick-base"><div id="joystick-stick"></div></div>

  <!-- Кнопка действия (справа сверху от джойстика) -->
  <button id="action-btn">ДЕЙСТВИЕ</button>

  <!-- Пошаговая Боевая Арена -->
  <div id="combat-arena">
    <div class="combat-header">
      <div class="combat-fighter">
        <div class="fighter-avatar" style="background:#2563eb;">🧙‍♂️</div>
        <div style="font-weight:bold; font-size:13px;" id="combat-player-name">Герой</div>
        <div class="fighter-bar"><div class="fighter-fill" id="arena-player-hp"></div></div>
        <div class="bar-num" id="arena-player-hp-text">100 / 100 HP</div>
        <div class="fighter-bar" style="margin-top:4px;"><div class="fighter-fill" id="arena-player-mp" style="background:#3b82f6;"></div></div>
        <div class="bar-num" id="arena-player-mp-text" style="color:#60a5fa;">100 / 100 MP</div>
      </div>
      <div style="font-weight:900; font-size:22px; color:#ef4444;">VS</div>
      <div class="combat-fighter">
        <div class="fighter-avatar" style="background:#dc2626;" id="arena-enemy-avatar">👹</div>
        <div style="font-weight:bold; font-size:13px;" id="arena-enemy-name">Враг</div>
        <div class="fighter-bar"><div class="fighter-fill" id="arena-enemy-hp" style="background:#ef4444;"></div></div>
        <div class="bar-num" id="arena-enemy-hp-text" style="color:#f87171;">65 / 65 HP</div>
      </div>
    </div>

    <div id="combat-dice-zone">
      <div style="font-size:12px; color:#94a3b8; font-weight:700;">КУБИК УРОНА D20</div>
      <div id="combat-dice-box">--</div>
      <div id="combat-log">Выберите умение для атаки!</div>
    </div>

    <!-- Кнопки скиллов в бою -->
    <div id="combat-skills-grid"></div>
  </div>

  <!-- Диалог -->
  <div id="dialog-modal">
    <div id="dialog-name">Собеседник</div>
    <div id="dialog-text">...</div>
    <div id="dialog-options"></div>
  </div>
</div>

<script src="game.js"></script>
</body>
</html>
